{% extends "base.html" %}

{% block title %}Sign In – Fitzen{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <!-- Login Card -->
            <div class="card card-fitzen shadow-lg p-4 p-md-5 border-0">
                <div class="text-center mb-4">
                    <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.5rem;">
                        <i class="bi bi-person-lock"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
                    <p class="text-muted small">Sign in to resume tracking your health and wellness goals</p>
                </div>

                <form action="{{ url_for('login') }}" method="POST" class="needs-validation" novalidate>
                    <!-- Email Input -->
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            <i class="bi bi-envelope me-1 text-muted"></i> Email Address
                        </label>
                        <input 
                            type="email" 
                            class="form-control" 
                            id="email" 
                            name="email" 
                            placeholder="name@example.com" 
                            required 
                            autofocus
                        >
                    </div>

                    <!-- Password Input -->
                    <div class="mb-4">
                        <label for="password" class="form-label">
                            <i class="bi bi-shield-lock me-1 text-muted"></i> Password
                        </label>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            name="password" 
                            placeholder="••••••••" 
                            required
                        >
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-fitzen w-100 py-2 fs-6 mb-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Sign In to Fitzen
                    </button>
                </form>

                <div class="text-center pt-3 border-top">
                    <p class="small text-muted mb-0">
                        Don't have an account yet? 
                        <a href="{{ url_for('register') }}" class="text-success fw-bold text-decoration-none">
                            Create Account
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
